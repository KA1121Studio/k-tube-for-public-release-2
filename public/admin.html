<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>K-tube管理</title></head>
<body>
  <div id="loginForm">
    <input id="adminId" placeholder="ID"><input id="adminPw" type="password" placeholder="PW">
    <button onclick="login()">ログイン</button>
  </div>
  <div id="adminPanel" style="display:none;">
    <!-- お知らせフォームなど -->
  </div>
  <script>
    let token = null;
    async function login() {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ id: adminId.value, password: adminPw.value })
      });
      if (res.ok) {
        const data = await res.json();
        token = data.token;
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadNotifications();
      } else alert('ログイン失敗');
    }
    // 以下、CRUD操作を fetch で実装（要 requireAdmin ヘッダー付与）
  </script>
</body>
</html>
