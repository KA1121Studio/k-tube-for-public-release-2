      position:fixed;

<script>
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  const previewToken = urlParams.get('preview');
  
  if (previewToken) {
    const stored = localStorage.getItem('ktube_preview_token');
    if (stored) {
      try {
        const { token, expires } = JSON.parse(stored);
        if (token === previewToken && expires > Date.now()) {
          // プレビューモード有効
          sessionStorage.setItem('ktube_preview_mode', 'true');
          // トークンは使い捨て（再使用防止）
          localStorage.removeItem('ktube_preview_token');
          // クリーンなURLにリダイレクト（履歴置き換えで戻れないように）
          window.location.replace(window.location.pathname);
          return;
        }
      } catch(e) {
        console.error('Preview token parse error', e);
      }
    }
    // 認証失敗：権限なし画面
    document.body.innerHTML = `
      <div style="position:fixed; top:0; left:0; right:0; bottom:0; background:white; z-index:99999; display:flex; align-items:center; justify-content:center; flex-direction:column; font-family:sans-serif;">
        <h1 style="color:#c00;">⛔ アクセス権限がありません</h1>
        <p>このページは管理用です。</p>
        <button onclick="location.href='/'" style="margin-top:20px; padding:10px 24px; background:#065fd4; color:white; border:none; border-radius:40px; cursor:pointer;">ホームに戻る</button>
      </div>
    `;
    throw new Error('Preview unauthorized');
  }
})();
</script>

<script>
if (
  window.location.pathname === "/" ||
  window.location.pathname === "/index.html"
) {
  window.addEventListener('load', () => {
    const startup = document.getElementById('startup-container');

    let skipped = false;

    function closeStartup() {
      if (skipped || !startup) return;
      skipped = true;

      startup.classList.add('hide');

      setTimeout(() => {
        startup.remove();
      }, 1000);
    }

    // 10秒後に自動終了
    setTimeout(closeStartup, 10000);

    // クリック
    startup.addEventListener('click', closeStartup);

    // タップ
    startup.addEventListener('touchstart', closeStartup, {
      passive: true
    });

    // スペースキー
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        closeStartup();
      }
    });
  });
} else {
  document.getElementById('startup-container')?.remove();
}
</script>
